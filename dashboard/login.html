<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Titanex AI — Connexion</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{emerald:{50:'#f0fdf4',100:'#dcfce7',500:'#22c55e',600:'#16a34a',700:'#15803d'}}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
body{background:linear-gradient(135deg,#f8fafc 0%,#f0fdf4 50%,#f1f5f9 100%);min-height:100vh;font-size:15px;line-height:1.65}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .5s ease forwards}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.875rem 1rem;border-radius:1rem;background:#10b981;color:#fff;font-weight:700;font-size:.9rem;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(16,185,129,.3);transition:all .2s}
.btn-primary:hover{background:#059669;transform:translateY(-1px);box-shadow:0 6px 20px rgba(16,185,129,.4)}
.inp{width:100%;border-radius:1rem;border:2px solid #e2e8f0;padding:.875rem 1rem .875rem 2.75rem;font-size:.9375rem;background:#f8fafc;color:#0f172a;outline:none;transition:all .2s}
.inp:focus{border-color:#10b981;background:#fff}
.inp::placeholder{color:#94a3b8}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text y='.9em' font-size='70' x='15' fill='white' font-weight='900'>T</text></svg>"/>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
<div class="w-full max-w-md fade-up">

  <!-- Logo -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-3xl mb-4" style="background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 8px 24px rgba(16,185,129,.3)">
      <span class="text-white font-black text-2xl">T</span>
    </div>
    <h1 class="text-2xl font-black text-slate-900 tracking-tight">Titanex <span style="color:#10b981">AI</span></h1>
    <p class="text-slate-500 text-sm mt-1" data-i18n="login_title">Connectez-vous à votre espace marchand</p>
  </div>

  <!-- Card -->
  <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/60 p-10 space-y-6">

    <!-- Google -->
    <button id="gbtn" class="w-full flex items-center justify-center gap-3 px-6 py-3.5 rounded-2xl border-2 border-slate-200 bg-white hover:border-emerald-300 hover:shadow-md transition-all font-semibold text-slate-700 text-sm">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      <span data-i18n="login_google">Se connecter avec Google</span>
    </button>

    <div class="flex items-center gap-3">
      <div class="flex-1 h-px bg-slate-200"></div>
      <span class="text-xs text-slate-400 font-medium" data-i18n="login_or">ou</span>
      <div class="flex-1 h-px bg-slate-200"></div>
    </div>

    <!-- Tabs -->
    <div class="flex bg-slate-100 rounded-2xl p-1">
      <button id="tab-email" onclick="switchTab('email')" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-semibold bg-white text-slate-900 shadow-sm transition-all">
        <i data-lucide="mail" class="w-4 h-4"></i> <span data-i18n="login_tab_email">Email</span>
      </button>
      <button id="tab-tel" onclick="switchTab('tel')" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-semibold text-slate-500 transition-all">
        <i data-lucide="smartphone" class="w-4 h-4"></i> <span data-i18n="login_tab_phone">Téléphone</span>
      </button>
    </div>

    <!-- Error -->
    <div id="err" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-2xl px-4 py-3 flex items-center gap-2">
      <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
      <span id="err-msg"></span>
    </div>

    <!-- Email form -->
    <div id="form-email" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2" data-i18n="login_email">Adresse email</label>
        <div class="relative">
          <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
          <input id="inp-email" type="email" placeholder="contact@maboutique.com" data-i18n="login_email_ph" class="inp" style="padding-left:2.75rem">
        </div>
      </div>
      <button onclick="doLogin('email')" class="btn-primary">
        <i data-lucide="log-in" class="w-4 h-4"></i> <span data-i18n="login_btn">Se connecter</span>
      </button>
    </div>

    <!-- Phone form -->
    <div id="form-tel" class="space-y-4 hidden">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2" data-i18n="login_phone">Numéro de téléphone</label>
        <div class="relative">
          <i data-lucide="smartphone" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
          <input id="inp-tel" type="tel" placeholder="237672482763" data-i18n="login_phone_ph" class="inp" style="padding-left:2.75rem">
        </div>
      </div>
      <button onclick="doLogin('tel')" class="btn-primary">
        <i data-lucide="log-in" class="w-4 h-4"></i> <span data-i18n="login_btn">Se connecter</span>
      </button>
    </div>

    <!-- Footer -->
    <p class="text-center text-sm text-slate-500">
      <span data-i18n="login_no_account">Pas encore de compte ?</span>
      <a href="/dashboard/inscription.html" style="color:#10b981" class="font-semibold hover:underline" data-i18n="login_create">Créer un compte gratuit</a>
    </p>
  </div>

  <div class="text-center mt-6 flex items-center justify-center gap-3">
    <a href="/" class="transition-colors hover:underline text-sm" style="color:#64748b" data-i18n="login_back">← Retour à l'accueil</a>
    <button id="lang-btn" onclick="setLang(LANG==='fr'?'en':'fr')" style="padding:6px 12px;border-radius:8px;border:1.5px solid #e2e8f0;background:#f8fafc;color:#374151;font-size:12px;font-weight:700;cursor:pointer">FR</button>
  </div>
</div>

<script>
// ─── i18n ────────────────────────────────────────────────────────────
var TRANSLATIONS={
fr:{
  login_title:"Connectez-vous à votre espace",
  login_email:"Adresse email",login_phone:"Numéro de téléphone",
  login_email_ph:"contact@maboutique.com",login_phone_ph:"237672482763",
  login_btn:"Se connecter",login_no_account:"Pas encore de compte ?",
  login_create:"Créer un compte gratuit",login_or:"ou",
  login_forgot:"Mot de passe oublié ?",login_welcome:"Bon retour !",
  login_google:"Se connecter avec Google",login_tab_email:"Email",login_tab_phone:"Téléphone",
  login_back:"← Retour à l'accueil",
  nav_login:"Se connecter",nav_trial:"Essai gratuit 🚀",
  error_enter_email:"Veuillez saisir votre email",error_enter_phone:"Veuillez saisir votre téléphone",
  error_network:"Erreur réseau. Réessayez.",error_google_email:"Email Google non disponible",error_email_unavail:"Email non disponible"
},
en:{
  login_title:"Sign in to your account",
  login_email:"Email address",login_phone:"Phone number",
  login_email_ph:"contact@mystore.com",login_phone_ph:"237672482763",
  login_btn:"Sign in",login_no_account:"No account yet?",
  login_create:"Create free account",login_or:"or",
  login_forgot:"Forgot password?",login_welcome:"Welcome back!",
  login_google:"Sign in with Google",login_tab_email:"Email",login_tab_phone:"Phone",
  login_back:"← Back to home",
  nav_login:"Sign in",nav_trial:"Free trial 🚀",
  error_enter_email:"Please enter your email",error_enter_phone:"Please enter your phone number",
  error_network:"Network error. Please retry.",error_google_email:"Google email not available",error_email_unavail:"Email not available"
}
};
var LANG=localStorage.getItem('titanex_lang')||'fr';
function t(key){return(TRANSLATIONS[LANG]&&TRANSLATIONS[LANG][key])||TRANSLATIONS.fr[key]||key;}
function setLang(lang){LANG=lang;localStorage.setItem('titanex_lang',lang);applyTranslations();updateLangBtn();}
function applyTranslations(){
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var key=el.getAttribute('data-i18n');var val=t(key);
    if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'){el.placeholder=val;}
    else{el.textContent=val;}
  });
}
function updateLangBtn(){var btn=document.getElementById('lang-btn');if(btn)btn.textContent=LANG==='fr'?'EN':'FR';}
document.addEventListener('DOMContentLoaded',function(){applyTranslations();updateLangBtn();});

var MODE='email';
var GCID='793316461529-1u1hdk079u85q9sjh4h13glgj8qhpib8.apps.googleusercontent.com';

function switchTab(t){
  MODE=t;
  var isEmail=(t==='email');
  document.getElementById('form-email').classList.toggle('hidden',!isEmail);
  document.getElementById('form-tel').classList.toggle('hidden',isEmail);
  var te=document.getElementById('tab-email'),tt=document.getElementById('tab-tel');
  if(isEmail){
    te.classList.add('bg-white','text-slate-900','shadow-sm');te.classList.remove('text-slate-500');
    tt.classList.remove('bg-white','text-slate-900','shadow-sm');tt.classList.add('text-slate-500');
  }else{
    tt.classList.add('bg-white','text-slate-900','shadow-sm');tt.classList.remove('text-slate-500');
    te.classList.remove('bg-white','text-slate-900','shadow-sm');te.classList.add('text-slate-500');
  }
}

function showErr(msg){
  var e=document.getElementById('err');
  document.getElementById('err-msg').textContent=msg;
  e.classList.remove('hidden');
}

async function doLogin(type){
  var val=(type==='email'?document.getElementById('inp-email'):document.getElementById('inp-tel')).value.trim();
  if(!val){showErr(t(type==='email'?'error_enter_email':'error_enter_phone'));return;}
  try{
    var body=type==='email'?{email:val}:{telephone:val};
    var r=await fetch('/admin/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var d=await r.json();
    if(d.error){showErr(d.error);return;}
    localStorage.setItem('titanex_session',JSON.stringify(d.session));
    window.location.href='/dashboard/';
  }catch(e){showErr(t('error_network'));}
}

function initGoogle(){
  if(typeof google==='undefined'){setTimeout(initGoogle,500);return;}
  google.accounts.id.initialize({
    client_id:GCID,
    callback:function(resp){
      var p=resp.credential.split('.');
      var pay=JSON.parse(atob(p[1]+'=='));
      var em=pay.email;
      if(!em){showErr(t('error_google_email'));return;}
      fetch('/admin/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em})})
        .then(function(r){return r.json();})
        .then(function(d){
          if(d.error){showErr(d.error);return;}
          localStorage.setItem('titanex_session',JSON.stringify(d.session));
          window.location.href='/dashboard/';
        }).catch(function(){showErr(t('error_network'));});
    }
  });
  document.getElementById('gbtn').onclick=function(){
    google.accounts.oauth2.initTokenClient({
      client_id:GCID,scope:'email profile',
      callback:function(resp){
        if(resp.access_token){
          fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+resp.access_token}})
            .then(function(r){return r.json();})
            .then(function(u){
              var em=u.email;
              if(!em){showErr(t('error_email_unavail'));return;}
              fetch('/admin/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em})})
                .then(function(r){return r.json();})
                .then(function(d){
                  if(d.error){showErr(d.error);return;}
                  localStorage.setItem('titanex_session',JSON.stringify(d.session));
                  window.location.href='/dashboard/';
                });
            });
        }
      }
    }).requestAccessToken();
  };
}
window.addEventListener('load',function(){lucide.createIcons();initGoogle();});
</script>
</body>
</html>
