<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Titanex AI — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#f8fafc 0%,#f0fdf4 50%,#f1f5f9 100%);min-height:100vh;font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.65;display:flex;align-items:center;justify-content:center;padding:1rem}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .5s ease forwards}
.card{background:#fff;border-radius:1.5rem;box-shadow:0 20px 60px rgba(100,116,139,.12);padding:2.5rem;max-width:28rem;width:100%}
.logo-box{display:inline-flex;align-items:center;justify-content:center;width:4rem;height:4rem;border-radius:1.5rem;background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 8px 24px rgba(16,185,129,.3);margin-bottom:1rem}
.logo-box span{color:#fff;font-weight:900;font-size:1.5rem}
h1{font-size:1.5rem;font-weight:900;color:#0f172a;letter-spacing:-.02em}
h1 em{color:#10b981;font-style:normal}
.subtitle{color:#64748b;font-size:.875rem;margin-top:.25rem}
.btn-google{display:flex;align-items:center;justify-content:center;gap:.75rem;width:100%;padding:.875rem 1.5rem;border-radius:1rem;border:2px solid #e2e8f0;background:#fff;font-weight:600;color:#374151;font-size:.875rem;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-google:hover{border-color:#6ee7b7;box-shadow:0 4px 12px rgba(16,185,129,.15)}
.divider{display:flex;align-items:center;gap:.75rem;margin:1.5rem 0}
.divider span{font-size:.75rem;color:#94a3b8;font-weight:500}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e2e8f0}
.tabs{display:flex;background:#f1f5f9;border-radius:1rem;padding:4px;margin-bottom:1.5rem}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.625rem;border-radius:.75rem;font-size:.875rem;font-weight:600;border:none;cursor:pointer;transition:all .2s;background:transparent;color:#64748b;font-family:inherit}
.tab.active{background:#fff;color:#0f172a;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.875rem;font-weight:600;color:#374151;margin-bottom:.5rem}
.input-wrap{position:relative}
.input-wrap .icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:1rem;line-height:1;pointer-events:none}
.inp{width:100%;border-radius:1rem;border:2px solid #e2e8f0;padding:.875rem 1rem .875rem 2.75rem;font-size:.9375rem;background:#f8fafc;color:#0f172a;outline:none;transition:all .2s;font-family:inherit}
.inp:focus{border-color:#10b981;background:#fff}
.inp::placeholder{color:#94a3b8}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.875rem 1rem;border-radius:1rem;background:#10b981;color:#fff;font-weight:700;font-size:.9rem;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(16,185,129,.3);transition:all .2s;font-family:inherit}
.btn-primary:hover{background:#059669;transform:translateY(-1px);box-shadow:0 6px 20px rgba(16,185,129,.4)}
.err-box{display:none;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:.875rem;border-radius:1rem;padding:.75rem 1rem;align-items:center;gap:.5rem;margin-bottom:1rem}
.err-box.visible{display:flex}
.footer{text-align:center;font-size:.875rem;color:#64748b;margin-top:1.5rem}
.footer a{color:#10b981;font-weight:600;text-decoration:none}
.footer a:hover{text-decoration:underline}
.bottom-bar{text-align:center;margin-top:1.5rem;display:flex;align-items:center;justify-content:center;gap:.75rem}
.bottom-bar a{color:#64748b;font-size:.875rem;text-decoration:none;transition:color .2s}
.bottom-bar a:hover{text-decoration:underline}
.lang-btn{padding:6px 12px;border-radius:8px;border:1.5px solid #e2e8f0;background:#f8fafc;color:#374151;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.hidden{display:none!important}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2315803D'/><text y='.9em' font-size='70' x='15' fill='white' font-weight='900'>T</text></svg>"/>
</head>
<body>
<div class="fade-up" style="width:100%;max-width:28rem">

  <div style="text-align:center;margin-bottom:2rem">
    <div class="logo-box"><span>T</span></div>
    <h1>Titanex <em>AI</em></h1>
    <p class="subtitle" data-i18n="login_title">Connectez-vous à votre espace marchand</p>
  </div>

  <div class="card">

    <button type="button" id="gbtn" class="btn-google">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      <span data-i18n="login_google">Se connecter avec Google</span>
    </button>

    <div class="divider"><span data-i18n="login_or">ou</span></div>

    <div class="tabs">
      <button type="button" id="tab-email" class="tab active">
        <span>&#9993;</span> <span data-i18n="login_tab_email">Email</span>
      </button>
      <button type="button" id="tab-tel" class="tab">
        <span>&#128241;</span> <span data-i18n="login_tab_phone">Telephone</span>
      </button>
    </div>

    <div id="err" class="err-box">
      <span>&#9888;</span>
      <span id="err-msg"></span>
    </div>

    <div id="form-email">
      <div class="form-group">
        <label data-i18n="login_email">Adresse email</label>
        <div class="input-wrap">
          <span class="icon">&#9993;</span>
          <input id="inp-email" type="email" placeholder="contact@maboutique.com" data-i18n="login_email_ph" class="inp">
        </div>
      </div>
      <button type="button" id="btn-login-email" class="btn-primary">
        &#10140; <span data-i18n="login_btn">Se connecter</span>
      </button>
    </div>

    <div id="form-tel" class="hidden">
      <div class="form-group">
        <label data-i18n="login_phone">Numero de telephone</label>
        <div class="input-wrap">
          <span class="icon">&#128241;</span>
          <input id="inp-tel" type="tel" placeholder="237672482763" data-i18n="login_phone_ph" class="inp">
        </div>
      </div>
      <button type="button" id="btn-login-tel" class="btn-primary">
        &#10140; <span data-i18n="login_btn">Se connecter</span>
      </button>
    </div>

    <p class="footer">
      <span data-i18n="login_no_account">Pas encore de compte ?</span>
      <a href="/dashboard/inscription.html" data-i18n="login_create">Creer un compte gratuit</a>
    </p>
  </div>

  <div class="bottom-bar">
    <a href="/" data-i18n="login_back">&#8592; Retour a l'accueil</a>
    <button type="button" id="lang-btn" class="lang-btn">FR</button>
  </div>
</div>

<script>
// ─── i18n ──────────────────────────────────────────────────────────────
var TRANSLATIONS={
fr:{
  login_title:"Connectez-vous \u00e0 votre espace",
  login_email:"Adresse email",login_phone:"Num\u00e9ro de t\u00e9l\u00e9phone",
  login_email_ph:"contact@maboutique.com",login_phone_ph:"237672482763",
  login_btn:"Se connecter",login_no_account:"Pas encore de compte ?",
  login_create:"Cr\u00e9er un compte gratuit",login_or:"ou",
  login_google:"Se connecter avec Google",login_tab_email:"Email",login_tab_phone:"T\u00e9l\u00e9phone",
  login_back:"\u2190 Retour \u00e0 l\u2019accueil",
  error_enter_email:"Veuillez saisir votre email",error_enter_phone:"Veuillez saisir votre t\u00e9l\u00e9phone",
  error_network:"Erreur r\u00e9seau. R\u00e9essayez.",error_google_email:"Email Google non disponible",error_email_unavail:"Email non disponible"
},
en:{
  login_title:"Sign in to your account",
  login_email:"Email address",login_phone:"Phone number",
  login_email_ph:"contact@mystore.com",login_phone_ph:"237672482763",
  login_btn:"Sign in",login_no_account:"No account yet?",
  login_create:"Create free account",login_or:"or",
  login_google:"Sign in with Google",login_tab_email:"Email",login_tab_phone:"Phone",
  login_back:"\u2190 Back to home",
  error_enter_email:"Please enter your email",error_enter_phone:"Please enter your phone number",
  error_network:"Network error. Please retry.",error_google_email:"Google email not available",error_email_unavail:"Email not available"
}
};

var LANG=localStorage.getItem('titanex_lang')||'fr';
var GCID='793316461529-1u1hdk079u85q9sjh4h13glgj8qhpib8.apps.googleusercontent.com';

function t(key){return(TRANSLATIONS[LANG]&&TRANSLATIONS[LANG][key])||TRANSLATIONS.fr[key]||key;}

function applyTranslations(){
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var key=el.getAttribute('data-i18n');var val=t(key);
    if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'){el.placeholder=val;}
    else{el.textContent=val;}
  });
}

function updateLangBtn(){
  var btn=document.getElementById('lang-btn');
  if(btn) btn.textContent=LANG==='fr'?'EN':'FR';
}

function switchTab(mode){
  var isEmail=(mode==='email');
  document.getElementById('form-email').classList.toggle('hidden',!isEmail);
  document.getElementById('form-tel').classList.toggle('hidden',isEmail);
  document.getElementById('tab-email').classList.toggle('active',isEmail);
  document.getElementById('tab-tel').classList.toggle('active',!isEmail);
}

function showErr(msg){
  var box=document.getElementById('err');
  document.getElementById('err-msg').textContent=msg;
  box.classList.add('visible');
}

function hideErr(){
  document.getElementById('err').classList.remove('visible');
}

function doLogin(type){
  hideErr();
  var inp=type==='email'?document.getElementById('inp-email'):document.getElementById('inp-tel');
  var val=inp.value.trim();
  if(!val){showErr(t(type==='email'?'error_enter_email':'error_enter_phone'));return;}
  var body=type==='email'?{email:val}:{telephone:val};
  fetch('/admin/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.error){showErr(d.error);return;}
      localStorage.setItem('titanex_session',JSON.stringify(d.session));
      window.location.href='/dashboard/';
    })
    .catch(function(e){
      console.error('[doLogin]',e);
      showErr(t('error_network'));
    });
}

function initGoogle(){
  if(typeof google==='undefined'){setTimeout(initGoogle,500);return;}
  google.accounts.id.initialize({
    client_id:GCID,
    callback:function(resp){
      var p=resp.credential.split('.');
      var pay=JSON.parse(atob(p[1]+'=='));
      var em=pay.email;
      if(!em){showErr(t('error_google_email'));return;}
      fetch('/admin/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em})})
        .then(function(r){return r.json();})
        .then(function(d){
          if(d.error){showErr(d.error);return;}
          localStorage.setItem('titanex_session',JSON.stringify(d.session));
          window.location.href='/dashboard/';
        }).catch(function(){showErr(t('error_network'));});
    }
  });
}

// ─── Wire up all event listeners ──────────────────────────────────────
document.getElementById('btn-login-email').addEventListener('click',function(){doLogin('email');});
document.getElementById('btn-login-tel').addEventListener('click',function(){doLogin('tel');});
document.getElementById('tab-email').addEventListener('click',function(){switchTab('email');});
document.getElementById('tab-tel').addEventListener('click',function(){switchTab('tel');});
document.getElementById('lang-btn').addEventListener('click',function(){
  LANG=LANG==='fr'?'en':'fr';
  localStorage.setItem('titanex_lang',LANG);
  applyTranslations();
  updateLangBtn();
});
document.getElementById('gbtn').addEventListener('click',function(){
  if(typeof google==='undefined')return;
  google.accounts.oauth2.initTokenClient({
    client_id:GCID,scope:'email profile',
    callback:function(resp){
      if(resp.access_token){
        fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+resp.access_token}})
          .then(function(r){return r.json();})
          .then(function(u){
            var em=u.email;
            if(!em){showErr(t('error_email_unavail'));return;}
            fetch('/admin/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em})})
              .then(function(r){return r.json();})
              .then(function(d){
                if(d.error){showErr(d.error);return;}
                localStorage.setItem('titanex_session',JSON.stringify(d.session));
                window.location.href='/dashboard/';
              });
          });
      }
    }
  }).requestAccessToken();
});

// Enter key submits the visible form
document.getElementById('inp-email').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin('email');});
document.getElementById('inp-tel').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin('tel');});

// Init
applyTranslations();
updateLangBtn();
initGoogle();
</script>
</body>
</html>
