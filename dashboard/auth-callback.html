<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Titanex AI - Connexion...</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#f0f0f0;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}@keyframes spin{to{transform:rotate(360deg)}}.logo{font-size:1.3rem;font-weight:800;margin-bottom:1rem}.logo em{color:#22c55e;font-style:normal}.msg{color:#888;font-size:.85rem;margin-bottom:1rem}.spinner{width:28px;height:28px;border:3px solid #252525;border-top-color:#22c55e;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2315803D'/><text y='.9em' font-size='70' x='15' fill='white' font-weight='900'>T</text></svg>"/>
</head><body>
<div>
  <div class="logo">Titanex <em>AI</em></div>
  <div class="msg" id="msg">Connexion Google en cours...</div>
  <div class="spinner"></div>
</div>
<script>
var SUPABASE_URL = 'https://fkhbkxaqlehdlqnybqxt.supabase.co';
var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZraGJreGFxbGVoZGxxbnlicXh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5NDM1MTUsImV4cCI6MjA4NjUxOTUxNX0.2w42p0OGIpdYqK_CY1zWObDQblww6FoZHondualRb8Q';
var API = window.location.protocol + '//' + window.location.hostname;
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

function setMsg(m){ document.getElementById('msg').textContent = m; }

// Parse tokens from URL hash (#access_token=...&refresh_token=...&...)
function getHashParams() {
  var hash = window.location.hash.substring(1);
  var params = {};
  hash.split('&').forEach(function(part) {
    var kv = part.split('=');
    if (kv.length === 2) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]);
  });
  return params;
}

var hashParams = getHashParams();
var initPromise;

console.log('[AUTH-CB] 1. Raw hash:', window.location.hash ? window.location.hash.substring(0, 100) + '...' : '(empty)');
console.log('[AUTH-CB] 2. Parsed hash keys:', Object.keys(hashParams).join(', ') || '(none)');
console.log('[AUTH-CB] 2. access_token:', hashParams.access_token ? hashParams.access_token.substring(0, 20) + '...' : '(missing)');
console.log('[AUTH-CB] 2. refresh_token:', hashParams.refresh_token ? hashParams.refresh_token.substring(0, 20) + '...' : '(missing)');
console.log('[AUTH-CB] 2. type:', hashParams.type || '(missing)');

if (hashParams.access_token && hashParams.refresh_token) {
  console.log('[AUTH-CB] 3. Calling sb.auth.setSession()...');
  initPromise = sb.auth.setSession({
    access_token: hashParams.access_token,
    refresh_token: hashParams.refresh_token
  });
} else {
  console.log('[AUTH-CB] 3. No hash tokens, falling back to sb.auth.getSession()...');
  initPromise = sb.auth.getSession();
}

initPromise.then(function(r) {
  console.log('[AUTH-CB] 4. setSession/getSession result:', JSON.stringify({
    hasData: !!r.data,
    hasSession: !!(r.data && r.data.session),
    hasUser: !!(r.data && r.data.session && r.data.session.user),
    error: r.error ? r.error.message : null
  }));

  var session = r.data && r.data.session;
  if (r.error || !session || !session.user) {
    console.error('[AUTH-CB] FAIL: No valid session/user.', r.error ? r.error.message : (session ? 'session sans user' : 'pas de session'), JSON.stringify(r));
    setMsg('Session introuvable. Si vous avez déjà un compte, veuillez vous connecter. Redirection...');
    setTimeout(function(){ location.href = '/dashboard/login.html'; }, 5000);
    return;
  }
  var user = session.user;
  var email = user.email || '';
  var nom = (user.user_metadata && user.user_metadata.full_name) || email.split('@')[0];
  console.log('[AUTH-CB] 5. User extracted — email:', email, 'nom:', nom, 'supabase_uid:', user.id);
  setMsg('Compte Google detecte, configuration...');

  var registerBody = {
    nom: nom,
    email: email,
    telephone: '',
    oauth: true,
    plan: 'starter',
    instance_name: 'boutique_' + Date.now()
  };
  console.log('[AUTH-CB] 6. POST /auth/register — email:', email);

  fetch(API + '/auth/register', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(registerBody)
  }).then(function(res){ console.log('[AUTH-CB] 7. /auth/register status:', res.status); return res.json(); })
  .then(function(d) {
    console.log('[AUTH-CB] 8. /auth/register response:', JSON.stringify(d).substring(0, 200));
    if (d.token) {
      localStorage.setItem('titanex_token', d.token);
      localStorage.setItem('titanex_user', JSON.stringify(d.tenant));
      var sess = Object.assign({}, d.tenant, { token: d.token });
      localStorage.setItem('titanex_session', JSON.stringify(sess));
      console.log('[AUTH-CB] 9. SUCCESS (new user) — stored session, redirecting to dashboard');
      setMsg('Connexion reussie ! Redirection...');
      setTimeout(function(){
        if (d.tenant.role === 'admin' || d.tenant.role === 'superadmin') {
          location.href = '/dashboard/superadmin.html';
        } else {
          location.href = '/dashboard/';
        }
      }, 800);
    } else if (d.error && d.error.includes('deja inscrit')) {
      console.log('[AUTH-CB] 8b. Already registered, trying /auth/login...');
      fetch(API + '/admin/auth/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email: email })
      }).then(function(res){ console.log('[AUTH-CB] 9. /admin/auth/login status:', res.status); return res.json(); })
      .then(function(d2) {
        console.log('[AUTH-CB] 10. /admin/auth/login response:', JSON.stringify(d2).substring(0, 200));
        if (d2.session && d2.session.token) {
          localStorage.setItem('titanex_token', d2.session.token);
          localStorage.setItem('titanex_session', JSON.stringify(d2.session));
          console.log('[AUTH-CB] 11. SUCCESS (existing user) — stored session, redirecting to dashboard');
          setMsg('Connexion reussie !');
          setTimeout(function(){
            if (d2.session.role === 'admin' || d2.session.role === 'superadmin') {
              location.href = '/dashboard/superadmin.html';
            } else {
              location.href = '/dashboard/';
            }
          }, 800);
        } else {
          console.error('[AUTH-CB] FAIL at /admin/auth/login:', JSON.stringify(d2));
          setMsg('Erreur: ' + (d2.error || 'Connexion echouee'));
          setTimeout(function(){ location.href = '/dashboard/login.html'; }, 5000);
        }
      });
    } else {
      console.error('[AUTH-CB] FAIL at /auth/register:', JSON.stringify(d));
      setMsg('Erreur: ' + (d.error || 'Inconnue'));
      setTimeout(function(){ location.href = '/dashboard/login.html'; }, 5000);
    }
  }).catch(function(e) {
    console.error('[AUTH-CB] FETCH ERROR:', e.message, e.stack);
    setMsg('Erreur serveur: ' + e.message);
    setTimeout(function(){ location.href = '/dashboard/login.html'; }, 5000);
  });
}).catch(function(e) {
  console.error('[AUTH-CB] setSession/getSession THREW:', e.message, e.stack);
  setMsg('Erreur session: ' + e.message);
  setTimeout(function(){ location.href = '/dashboard/login.html'; }, 5000);
});
</script>
</body></html>
